<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker Pro</h1>
            <p>Track, analyze, and manage your spending.</p>
        </header>
        
        <main>
            <div class="input-section card">
                <h2>Add New Expense</h2>
                <form id="expense-form">
                    <input type="text" id="expense-name" placeholder="Expense Name (e.g., Coffee)" required>
                    <input type="number" id="expense-amount" placeholder="Amount ($)" required min="0.01" step="0.01">
                    <select id="expense-category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transportation</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit">Add Expense</button>
                </form>
            </div>

            <div class="dashboard card">
                <div class="chart-container">
                    <canvas id="expenseChart"></canvas>
                </div>
                <div class="summary">
                    <h3>Total Spent: <span id="total-amount">$0.00</span></h3>
                </div>
            </div>

            <div class="list-section card">
                <h2>Recent Transactions</h2>
                <ul id="expense-list"></ul>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
